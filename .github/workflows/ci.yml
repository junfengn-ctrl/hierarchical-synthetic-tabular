name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tested.txt

      - name: Install verified dependencies
        run: python -m pip install -r requirements-tested.txt

      - name: Compile Python sources
        run: python -m compileall -q src examples tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run download-free smoke demo
        run: python examples/smoke_demo.py
